<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theo dõi đơn hàng | Cơm Tấm Nhà Mình</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-icon">🍚</span><div><b>Cơm Tấm Nhà Mình</b><small>Ngon như cơm nhà</small></div></div><nav><a href="index.html">Trang chủ</a><a href="menu.html">Thực đơn</a><a class="active" href="order-tracking.html">📦 Theo dõi đơn</a><a href="cart.html">🛒 Giỏ hàng <span id="cartCount">0</span></a></nav></header>
<main class="container tracking-page"><span class="pill">ĐƠN HÀNG CỦA BẠN</span><h1>📦 Theo dõi trạng thái đơn hàng</h1><p>Nhập mã đơn hàng sau khi đặt món, ví dụ: <b>CT123456</b>.</p><div class="tracking-search"><input id="trackingCode" placeholder="Nhập mã đơn hàng"><button class="btn primary" onclick="showOrder()">Theo dõi</button></div><div id="trackingResult"></div></main>
<script src="script.js"></script><script>
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function showOrder(){const code=document.getElementById('trackingCode').value.trim().toUpperCase(),box=document.getElementById('trackingResult');if(!code){box.innerHTML='<div class="empty">Vui lòng nhập mã đơn hàng.</div>';return}const order=JSON.parse(localStorage.getItem('comtam_order_'+code)||'null');if(!order){box.innerHTML='<div class="empty">Không tìm thấy đơn hàng trên thiết bị này.</div>';return}const statuses=['Đã nhận đơn','Đã xác nhận','Đang chuẩn bị món','Đang giao hàng','Đã giao thành công'];const st=Math.min(Number(order.status||0),4);box.innerHTML=`<div class="tracking-card"><div class="tracking-head"><div><span class="pill">MÃ ĐƠN</span><h2>${esc(order.code)}</h2></div><b class="status-badge">${statuses[st]}</b></div><div class="order-meta"><p><b>Khách:</b> ${esc(order.name)}</p><p><b>Số điện thoại:</b> ${esc(order.phone)}</p><p><b>Địa chỉ:</b> ${esc(order.address)}</p><p><b>Tổng tiền:</b> ${money(order.total)}</p></div><div class="timeline">${statuses.map((x,i)=>`<div class="timeline-item ${i<=st?'done':''}"><span>${i<=st?'✓':i+1}</span><b>${x}</b></div>`).join('')}</div><p class="tracking-note">Bạn có thể lưu mã <b>${esc(order.code)}</b> để tra cứu lại trên thiết bị đã đặt đơn.</p></div>`}
const q=new URLSearchParams(location.search).get('code');if(q){document.getElementById('trackingCode').value=q;showOrder()}updateCartCount();
</script></body></html>
